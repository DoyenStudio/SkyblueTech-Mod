<h1>电动机件加工台</h1><p>灰白金属机柜 · 蓝色工作台面 · 自动焊接头</p>
<canvas width="1000" height="720"></canvas><br>
<button onclick="yaw=-0.65;draw()">正面斜视</button><button onclick="yaw=0;draw()">正面</button><button onclick="yaw=1.57;draw()">侧面</button><button onclick="yaw=2.5;draw()">背面斜视</button>
<p>拖动旋转。此预览展示静态几何与贴图，游戏内效果以客户端为准。</p>
